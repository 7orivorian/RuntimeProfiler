<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title</title>
    <style>
        :root {
            --background-color: hsl(222, 22%, 4%);
            --foreground-color: hsl(222, 22%, 14%);
            --foreground-color-light: hsl(222, 22%, 16%);
            --foreground-color-lighter: hsl(222, 22%, 18%);
            --primary-color: hsl(243, 50%, 47%);
            --secondary-color: hsl(239, 48%, 68%);
            --text-color: hsl(223, 80%, 90%);
        }

        * {
            box-sizing: border-box !important;

            margin: 0;
            padding: 0;

            font-family: sans-serif;
        }

        body {
            position: relative;
            display: flex;
            flex-flow: column wrap;

            padding: 20px;
            width: 100%;
            height: 100%;
            min-height: 100vh;

            background-color: var(--background-color);
            color: var(--text-color);
        }

        .container {
            display: flex;
            flex-flow: column wrap;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 20px;

            padding: 10px;

            width: fit-content;
            min-width: 100%;
            height: 100%;

            background: var(--foreground-color);
            border-radius: 10px;
        }

        table {
            border-collapse: collapse;
            border: 2px solid var(--primary-color);
        }

        caption {
            caption-side: top;
            padding: 10px;
        }

        thead,
        tfoot {
            background-color: var(--primary-color);
        }

        th,
        td {
            border: 2px solid var(--background-color);
            padding: 10px;
        }

        tbody > tr:nth-of-type(odd) {
            background-color: var(--foreground-color-light);
        }

        tbody > tr:nth-of-type(even) {
            background-color: var(--foreground-color-lighter);
        }

        a,
        span {
            color: var(--secondary-color);
        }

        .copyable {
            cursor: pointer;
        }

        #options {

        }

        footer {
            position: relative;
            display: flex;
            flex-flow: row wrap;
            justify-self: flex-end;
            gap: 0.25rem;

            margin-top: auto;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Profiler - <span class="copyable" title="Copy to clipboard">$label</span></h1>
        <h3 id="dateheader">Generated on <span class="copyable" title="Copy to clipboard">$date</span></h3>
    </header>
    <div id="options">
        <label for="simple-dropdown">TimeUnit Override</label>
        <select id="simple-dropdown">
            <option value="none" selected>none</option>
            <option value="ns">ns (nanoseconds)</option>
            <option value="us">us (microseconds)</option>
            <option value="ms">ms (milliseconds)</option>
            <option value="s">s (seconds)</option>
            <option value="m">m (minutes)</option>
            <option value="h">h (hours)</option>
            <option value="d">d (days)</option>
        </select>
    </div>
    <div id="table">
        <table>
            <!--@formatter:off-->
        <caption>
            Timed in <span id="timeunit" title="Overriding with a smaller TimeUnit than this may lead to inaccuracies">$timeunits (<originalunit>$abbrtimeunit</originalunit>)</span>
        </caption>
        <!--@formatter:on-->
            <thead>
            $tableheader
            </thead>
            <tbody>
            $tablebody
            </tbody>
        </table>
    </div>
</div>
<footer>
    Generated with <a href="https://github.com/7orivorian/RuntimeProfiler" target="_blank" title="Open in new Tab">RuntimeProfiler</a>
</footer>
</body>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.copyable').forEach(element => {
            element.addEventListener('click', () => {
                copyToClipboard(element.textContent);
            });
        });

        const defaultTimeUnit = document.querySelector('originalunit').textContent;

        const dropdown = document.querySelector('#simple-dropdown');

        dropdown.addEventListener('change', () => {
            const selectedOption = dropdown.options[dropdown.selectedIndex].value;
            switch (selectedOption) {
                case "none": {
                    document.querySelectorAll('duration').forEach(element => {
                        element.textContent = element.getAttribute('original');
                    });
                    document.querySelectorAll('unitabbr').forEach(element => {
                        element.textContent = defaultTimeUnit;
                    });
                    break;
                }
                default: {
                    document.querySelectorAll('duration').forEach(element => {
                        const unit = element.getAttribute('unit');
                        const val = parseInt(element.getAttribute('original'));
                        element.textContent = convertTimeUnit(val, unit, selectedOption);
                    });
                    document.querySelectorAll('unitabbr').forEach(element => {
                        element.textContent = selectedOption;
                    });
                    break;
                }
            }
        });
    });

    function convertTimeUnit(value, fromUnit, toUnit) {
        const units = {
            'ns': 1e-9,
            'us': 1e-6,
            'ms': 1e-3,
            's': 1,
            'm': 60,
            'h': 3600,
            'd': 86400
        };
        const seconds = value * units[fromUnit];
        const convertedValue = seconds / units[toUnit];
        let fixed = convertedValue.toFixed(3);
        if (fixed.includes(".")) {
            fixed = fixed.replace(/\.?0*$/, '');
            if (fixed.endsWith('.')) {
                fixed = fixed.slice(0, -1);
            }
        }
        return fixed;
    }

    function copyToClipboard(text) {
        if (!navigator.clipboard) {
            console.error('Clipboard API not supported');
            return;
        }

        navigator.clipboard.writeText(text).catch(err => {
            console.error('Could not copy text: ', err);
        });
    }
</script>
</html>
